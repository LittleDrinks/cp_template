name: Build Typst document
on:
  push:
    paths:
      - "*.typ"
      - src/**
      - .github/workflows/build.yml
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core fonts-noto-cjk
      - uses: typst-community/setup-typst@v3
        id: setup-typst
      - name: Verify CJK fonts
        run: |
          typst fonts --font-path /usr/share/fonts/opentype/noto > /tmp/typst-fonts.txt
          grep -Fx 'DejaVu Sans Mono' /tmp/typst-fonts.txt
          grep -Fx 'Noto Sans CJK SC' /tmp/typst-fonts.txt
          grep -Fx 'Noto Sans Mono CJK SC' /tmp/typst-fonts.txt
      - name: Build PDF
        run: typst compile main.typ main.pdf --font-path /usr/share/fonts/opentype/noto --input x-git-commit=$(git rev-parse --short HEAD)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-pdf
          path: "*.pdf"

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: template-pdf
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.pdf"
  
  wf-trd:
    if: ${{ github.ref == 'refs/heads/wf-trd' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: template-pdf
      - name: Create WF-TRD Nightly Release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          title: "WF-TRD Nightly Build"
          automatic_release_tag: wf-trd-nightly
          prerelease: true
          files: "*.pdf"
